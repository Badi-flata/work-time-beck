version: "2"
type: backend
tech_stack:
  - TypeScript
  - NestJS
  - PostgreSQL
  - Prisma ORM
features:
  - name: Authentication API
    description: User registration and login
    files:
      - src/users/users.controller.ts
      - src/users/users.service.ts
    endpoints:
      - method: POST
        path: /users/logUp
        description: Sign up user
        auth_required: false
        response_schema:
          "201": User created
      - method: POST
        path: /users/loginIn
        description: Login user
        auth_required: false
        response_schema:
          "201": Token and user returned
  - name: Attendance API
    description: Clock-in/out and shift management
    files:
      - src/attendance/attendance.controller.ts
      - src/attendance/attendance.service.ts
    endpoints:
      - method: POST
        path: /attendance/check-in
        description: Check in for shift
        auth_required: true
        response_schema:
          "201": Check-in registered
      - method: POST
        path: /attendance/check-out
        description: Check out for shift
        auth_required: true
        response_schema:
          "201": Check-out registered
      - method: GET
        path: /attendance/shift
        description: Get employee shift data
        auth_required: true
        response_schema:
          "200": Shift data
  - name: Managing API
    description: Manager control actions for employees, shifts and excuses
    files:
      - src/managing/managing.controller.ts
      - src/managing/managing.service.ts
    endpoints:
      - method: POST
        path: /managing/auto-check
        description: Run automatic checkout and absence check
        auth_required: true
        response_schema:
          "201": Auto check completed
      - method: GET
        path: /managing/pending-excuses
        description: List pending excuses
        auth_required: true
        response_schema:
          "200": List of excuses
      - method: POST
        path: /managing/approve-excuse/:id
        description: Approve excuse
        auth_required: true
        response_schema:
          "201": Excuse approved
known_limitations: []
